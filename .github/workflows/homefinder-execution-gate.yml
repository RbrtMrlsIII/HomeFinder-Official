name: HomeFinder execution gate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  execution-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate execution gate
        run: python3 scripts/execution-gate.py --json

      - name: Run deterministic enforcement self-test
        run: |
          python3 scripts/execution-gate.py --self-test
          test $? -eq 0
