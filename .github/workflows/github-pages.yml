name: GitHub Pages public live site

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - index.html
      - 404.html
      - active_development/3d/**
      - master/**
      - scripts/pages/**
      - .github/workflows/github-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify the Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Forbid Vercel production config
        shell: bash
        run: |
          set -euo pipefail
          if [ -f vercel.json ] || [ -d .vercel ]; then
            echo "Vercel production config is forbidden on HomeFinder." >&2
            exit 1
          fi

      - name: Prepare Pages dist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/master dist/active_development
          cp index.html 404.html dist/
          cp -R active_development/3d dist/active_development/3d
          # Delivery copy of the protected model. Do not mutate the source file.
          cp master/HomeFinder.sh3d dist/master/HomeFinder.sh3d
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/active_development/3d/viewer/SweetHome3DJSViewer-7.5.2/HomeFinderViewer.html
          test -f dist/master/HomeFinder.sh3d
          grep -q 'GitHub Pages' dist/index.html
          grep -q 'Vercel is not a production' dist/index.html
          if grep -qi 'http-equiv="refresh"' dist/index.html; then
            echo "index.html must not auto-redirect the public live site" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit-test the Pages scripts
        run: node --test scripts/pages/pages.test.mjs

      - name: Verify the artifact and serve it under /HomeFinder-Official/
        run: node scripts/pages/smoke-dist.mjs dist

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy HomeFinder public site (not Vercel)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Probe the live site (HTTP 200 and the revival landing)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe the deployed site
        run: node scripts/pages/probe.mjs "${{ needs.deploy.outputs.page_url }}"
