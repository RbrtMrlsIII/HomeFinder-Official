<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeFinder — GLB Spatial Validation</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0c1015; color: #eef2f7; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; }
    main { display: grid; min-height: 100vh; grid-template-rows: auto 1fr auto; }
    header, footer { padding: 14px 18px; background: rgba(12,16,21,.96); }
    header h1 { margin: 0 0 4px; font-size: 1.1rem; }
    header p, footer { margin: 0; font-size: .85rem; opacity: .8; }
    .viewer { position: relative; min-height: 0; }
    .hf-cinematic-backdrop { position: absolute; inset: 0; overflow: hidden; }
    .hf-cinematic-3d-stage { position: absolute; inset: 0; }
    .hf-cinematic-3d-canvas { display: block; width: 100%; height: 100%; }
    .controls { position: absolute; top: 14px; left: 14px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 28px); }
    button { border: 1px solid rgba(255,255,255,.22); background: rgba(16,22,29,.88); color: inherit; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
    button[aria-pressed="true"] { outline: 2px solid currentColor; }
    .status { position: absolute; left: 14px; bottom: 14px; z-index: 5; padding: 8px 10px; border-radius: 8px; background: rgba(16,22,29,.88); font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>HomeFinder spatial validation</h1>
      <p>Native WebGL2 spatial-validation scaffold using source-backed P04 target definitions.</p>
    </header>
    <section class="viewer" aria-label="HomeFinder spatial validation viewer">
      <div class="hf-cinematic-backdrop" id="cinematicBackdrop"></div>
      <div class="controls" aria-label="P04 target selection">
        <button type="button" data-target="t02-main-hall" aria-pressed="true">T02 Main Hall</button>
        <button type="button" data-target="t03-h07-kitchen" aria-pressed="false">T03 H-07 Kitchen</button>
        <button type="button" data-target="t03-h08-bedroom1" aria-pressed="false">T03 H-08 Bedroom #1</button>
        <button type="button" data-target="t04-h1-basement-firstfloor" aria-pressed="false">T04 Staircase</button>
        <button type="button" data-target="t05-h1-level1-interior-network" aria-pressed="false">T05 Level 1 Interior</button>
      </div>
      <div id="status" class="status">Target: t02-main-hall</div>
    </section>
    <footer>Physical authority remains <code>master/HomeFinder.sh3d</code>. This validation view does not mutate SH3D or GLB binaries.</footer>
  </main>

  <script>
    window.hfCinematic = {
      world: 'world-01-home',
      tier: 'medium',
      backdrop: document.getElementById('cinematicBackdrop')
    };
  </script>
  <script src="../../../js/reference-3d/cinematic-3d-adapter.js"></script>
  <script src="../../../js/reference-3d/cinematic-3d-renderer.js"></script>
  <script>
    (async () => {
      const buttons = [...document.querySelectorAll('[data-target]')];
      const status = document.getElementById('status');
      const setTarget = async (id) => {
        const result = await window.hfCinematic3D.setTarget(id);
        if (!result.changed) return;
        buttons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.target === id)));
        status.textContent = `Target: ${id}`;
      };
      buttons.forEach((button) => button.addEventListener('click', () => setTarget(button.dataset.target)));
      await window.hfCinematic3D.loadTargetManifest();
    })();
  </script>
</body>
</html>
