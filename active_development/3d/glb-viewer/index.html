<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeFinder — GLB Spatial Validation</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0c1015; color: #eef2f7; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; }
    main { display: grid; min-height: 100vh; grid-template-rows: auto 1fr auto; }
    header, footer { padding: 14px 18px; background: rgba(12,16,21,.96); }
    header h1 { margin: 0 0 4px; font-size: 1.1rem; }
    header p, footer { margin: 0; font-size: .85rem; opacity: .8; }
    .viewer { position: relative; min-height: 0; }
    .hf-cinematic-backdrop { position: absolute; inset: 0; overflow: hidden; }
    .hf-cinematic-3d-stage { position: absolute; inset: 0; }
    .hf-cinematic-3d-canvas { display: block; width: 100%; height: 100%; }
    .controls { position: absolute; top: 14px; left: 14px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 28px); }
    button { border: 1px solid rgba(255,255,255,.22); background: rgba(16,22,29,.88); color: inherit; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
    button[aria-pressed="true"] { outline: 2px solid currentColor; }
    .status { position: absolute; left: 14px; bottom: 14px; z-index: 5; padding: 8px 10px; border-radius: 8px; background: rgba(16,22,29,.88); font-size: .8rem; }
    .meta { padding: 12px 18px; white-space: pre-wrap; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: #10161d; }
    .ok { color: #8fd18f; }
    .warn { color: #f0c674; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>HomeFinder GLB spatial validation</h1>
      <p>Source-backed P04 target validation. Physical authority remains <code>master/HomeFinder.sh3d</code>.</p>
    </header>
    <section class="viewer" aria-label="HomeFinder GLB spatial validation viewer">
      <div class="hf-cinematic-backdrop" id="cinematicBackdrop"></div>
      <div class="controls" aria-label="P04 target selection">
        <button type="button" data-target="t02-main-hall" aria-pressed="true">T02 Main Hall / H-03</button>
        <button type="button" data-target="t03-h07-kitchen" aria-pressed="false">T03 Kitchen / H-07</button>
        <button type="button" data-target="t03-h08-bedroom1" aria-pressed="false">T03 Bedroom #1 / H-08</button>
        <button type="button" data-target="t04-h1-basement-firstfloor" aria-pressed="false">T04 Staircase</button>
        <button type="button" data-target="t05-h1-level1-interior-network" aria-pressed="false">T05 Level 1 Interior</button>
      </div>
      <div id="status" class="status">Loading GLB runtime…</div>
    </section>
    <div id="meta" class="meta">Awaiting runtime evidence…</div>
    <footer>Derived GLB only. No SH3D or GLB binary is mutated by this validation view.</footer>
  </main>

  <script>
    window.hfCinematic = {
      world: 'world-01-home',
      tier: 'medium',
      backdrop: document.getElementById('cinematicBackdrop')
    };
  </script>
  <script src="/active_development/js/reference-3d/cinematic-3d-asset-loader.js"></script>
  <script src="/active_development/js/reference-3d/cinematic-3d-adapter.js"></script>
  <script src="/active_development/js/reference-3d/cinematic-3d-glb-renderer.js"></script>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const meta = document.getElementById('meta');
      const buttons = [...document.querySelectorAll('[data-target]')];
      const setTarget = async (id) => {
        const result = await window.hfCinematic3D.setTarget(id);
        buttons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.target === id)));
        status.className = `status ${result.changed ? 'ok' : 'warn'}`;
        status.textContent = result.changed ? `Target: ${id}` : `Target rejected: ${id}`;
      };
      buttons.forEach((button) => button.addEventListener('click', () => setTarget(button.dataset.target)));

      try {
        await window.hfCinematic3D.loadManifest();
        await window.hfCinematic3D.loadTargetManifest();
        const mounted = window.hfCinematic3D.mount('world-01-home', {
          tier: 'medium',
          backdrop: document.getElementById('cinematicBackdrop')
        });
        if (!mounted.mounted) throw new Error(`mount failed: ${mounted.reason}`);
        status.className = 'status ok';
        status.textContent = 'GLB runtime mounting…';
        window.dispatchEvent(new CustomEvent('hf:p04-runtime-start', { detail: { targetId: window.hfCinematic3D.activeTarget } }));
        meta.textContent = [
          `Renderer attached: ${window.hfCinematic3D.rendererAttached}`,
          `Default target: ${window.hfCinematic3D.activeTarget}`,
          'Coordinate convention: source centimetres → runtime metres',
          'Scale: 0.01',
          'Axis contract: SH3D X/Y/Z → Three.js X/Z/Y via -90° X rotation',
          'Physical authority: master/HomeFinder.sh3d'
        ].join('\n');
      } catch (error) {
        status.className = 'status warn';
        status.textContent = `GLB runtime unavailable: ${error.message}`;
        meta.textContent = `P04 runtime error\n${error.stack || error.message}`;
      }
    })();
  </script>
</body>
</html>
